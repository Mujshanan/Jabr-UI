name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

permissions:
  contents: write

jobs:
  validate:
    name: Unit tests, browser integration, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Generate and commit pnpm lockfile
        if: github.event_name == 'pull_request' && hashFiles('pnpm-lock.yaml') == ''
        run: |
          pnpm install --lockfile-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Add pnpm lockfile generated with pnpm 10.34.5"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Worksheet controller tests
        run: pnpm test:controller

      - name: BlockSuite browser integration tests
        run: pnpm test:e2e

      - name: Typecheck and build
        run: pnpm build
